name: Radar tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.9"
            os: ubuntu-22.04
          - python-version: "3.x"
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile source and tests
        run: python -m compileall -q radar tests
      - name: Run unit and regression tests
        run: python -m unittest discover -s tests -v
      - name: Validate industry Packs
        run: |
          python -m radar validate --pack packs/weak-current/pack.json --seeds seeds/weak-current.json
          python -m radar validate --pack packs/video-kb/pack.json --seeds seeds/video-kb.json
          python -m radar validate --pack packs/data-center-ops/pack.json --seeds seeds/data-center-ops.json
          python -m radar validate --pack packs/pet-hospital/pack.json --seeds seeds/pet-hospital.json
      - name: Audit weak-current source ledger
        run: python tools/audit_ledger.py --pack packs/weak-current/pack.json --seeds seeds/weak-current.json --run runs/weak-current-demo

  pdf-optional:
    name: Optional PDF parser (Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --require-hashes -r requirements-pdf.txt
      - run: python -m compileall -q radar tests
      - run: python -m unittest discover -s tests -v

  docx-optional:
    name: Optional DOCX parser (Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --require-hashes -r requirements-docx.txt
      - run: python -m compileall -q radar tests
      - run: python -m unittest discover -s tests -v

  xlsx-optional:
    name: Optional XLSX parser (Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --require-hashes -r requirements-xlsx.txt
      - run: python -m compileall -q radar tests
      - run: python -m unittest discover -s tests -v

  pptx-optional:
    name: Optional PPTX parser (Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install optional PPTX dependencies with hash verification
        run: python -m pip install --require-hashes -r requirements-pptx.txt
      - run: python -m compileall -q radar tests
      - run: python -m unittest discover -s tests -v
