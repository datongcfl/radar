name: Radar tests

on:
  push:
    branches:
      - main
      - feat/requirement-driven-discovery
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.9"
            os: ubuntu-22.04
          - python-version: "3.x"
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile source and tests
        run: python -m compileall -q radar tests

      - name: Run unit and regression tests
        run: python -m unittest discover -s tests -v

      - name: Validate industry Packs
        run: |
          python -m radar validate --pack packs/weak-current/pack.json --seeds seeds/weak-current.json
          python -m radar validate --pack packs/video-kb/pack.json --seeds seeds/video-kb.json
          python -m radar validate --pack packs/data-center-ops/pack.json --seeds seeds/data-center-ops.json
          python -m radar validate --pack packs/pet-hospital/pack.json --seeds seeds/pet-hospital.json

      - name: Audit weak-current source ledger
        run: |
          python tools/audit_ledger.py --pack packs/weak-current/pack.json --seeds seeds/weak-current.json --run runs/weak-current-demo

      - name: Smoke test requirement-driven discover
        run: |
          python -m radar discover \
            --workspace ws_ci_smoke \
            --workspace-root "${{ runner.temp }}" \
            --requirements examples/requirements/weak-current.json \
            --pack packs/weak-current/pack.json \
            --seeds seeds/weak-current.json
