name: Package and dependency smoke

on:
  workflow_dispatch:
  push:
    branches:
      - feat/requirement-driven-discovery
      - feat/m15-dependency-governance
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "radar/**"
      - "tests/**"
      - ".github/workflows/package-smoke.yml"

permissions:
  contents: read

jobs:
  package-smoke:
    name: Python ${{ matrix.python-version }} package smoke
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.9"

      - name: Verify committed universal lockfile
        run: uv lock --check

      - name: Sync Core without optional extras
        run: uv sync --locked --no-dev --python "${{ matrix.python-version }}"

      - name: Verify installed CLI entry point
        run: |
          uv run --locked --python "${{ matrix.python-version }}" radar --help
          uv run --locked --python "${{ matrix.python-version }}" python -m radar --help

      - name: Run full test suite in locked Core environment
        run: uv run --locked --python "${{ matrix.python-version }}" python -m unittest discover -s tests -v

      - name: Build wheel and source distribution
        run: uv build --no-sources

      - name: Upload lockfile and package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: "package-smoke-python-${{ matrix.python-version }}"
          path: |
            uv.lock
            dist/
          if-no-files-found: error
          retention-days: 30
