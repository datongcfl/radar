name: Component candidate benchmarks

on:
  workflow_dispatch:
  push:
    branches:
      - feat/requirement-driven-discovery
    paths:
      - "tools/benchmarks/**"
      - ".github/workflows/component-benchmarks.yml"

permissions:
  contents: read

jobs:
  pdf-candidates:
    name: PDF candidate (${{ matrix.candidate }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - candidate: pypdf_6_21_4
            python-version: "3.9"
            os: ubuntu-22.04
            package: "pypdf==6.21.4"
          - candidate: pypdf_7_1_1
            python-version: "3.13"
            os: ubuntu-latest
            package: "pypdf==7.1.1"
          - candidate: pdfplumber_0_11_11
            python-version: "3.13"
            os: ubuntu-latest
            package: "pdfplumber==0.11.11"
          - candidate: pypdfium2_5_15_2
            python-version: "3.9"
            os: ubuntu-22.04
            package: "pypdfium2==5.15.2"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install isolated benchmark tools
        run: |
          python -m pip install --disable-pip-version-check "reportlab==4.5.1" "${{ matrix.package }}"
          mkdir -p benchmark-results
          python -m pip freeze > "benchmark-results/${{ matrix.candidate }}-environment.txt"

      - name: Run synthetic PDF benchmark
        run: |
          python tools/benchmarks/pdf_candidates.py \
            --candidate "${{ matrix.candidate }}" \
            --output "benchmark-results/${{ matrix.candidate }}.json"

      - name: Upload benchmark result
        uses: actions/upload-artifact@v4
        with:
          name: "pdf-benchmark-${{ matrix.candidate }}"
          path: benchmark-results/
          if-no-files-found: error
          retention-days: 30


  tree-sitter:
    name: Tree-sitter multi-language syntax probe
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install pinned Tree-sitter and grammar packages
        run: |
          python -m pip install --disable-pip-version-check \
            "tree-sitter==0.26.1" \
            "tree-sitter-python==0.25.0" \
            "tree-sitter-javascript==0.25.0" \
            "tree-sitter-java==0.23.5" \
            "tree-sitter-go==0.25.0"
          mkdir -p benchmark-results
          python -m pip freeze > benchmark-results/tree-sitter-environment.txt

      - name: Run multi-language syntax probe
        run: |
          python tools/benchmarks/tree_sitter_candidate.py \
            --output benchmark-results/tree-sitter-multilanguage.json

      - name: Upload benchmark result
        uses: actions/upload-artifact@v4
        with:
          name: tree-sitter-multilanguage-benchmark
          path: benchmark-results/
          if-no-files-found: error
          retention-days: 30
