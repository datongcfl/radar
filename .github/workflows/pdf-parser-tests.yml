name: Optional PDF parser tests

on:
  pull_request:
    paths:
      - "radar/pdf_parser.py"
      - "tests/test_pdf_parser.py"
      - "requirements-pdf.txt"
      - ".github/workflows/pdf-parser-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pdf:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"
      - name: Install optional PDF dependency with hash verification
        run: python -m pip install --require-hashes -r requirements-pdf.txt
      - name: Compile source and tests
        run: python -m compileall -q radar tests
      - name: Run PDF parser and full regression suite
        run: python -m unittest discover -s tests -v
